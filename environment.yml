name: mvp
channels:
  - conda-forge
dependencies:
  - python=3.7.10
  - ipython
  - pip
  - numpy=1.19.5
  - h5py=2.10.0
  - pandas=1.2.4
  - scikit-learn=0.24.2
  - matplotlib=3.4.2
  - biopython=1.78
  - pyteomics=4.4.2
  - shap=0.39.0
  # GPU runtime (matches TF 2.4.x)
  - cudatoolkit=11.0
  - cudnn=8.0.*
  - pip:
      - tensorflow==2.4.2

